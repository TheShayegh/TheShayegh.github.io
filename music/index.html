<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZAD Musics</title>
    <link rel="icon" href="../img/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        /* for touch screen */
        touch-action: none;
        flex-direction: column;
      }

      body {
        overflow: hidden;
        display: flex;
        background: #111;
        perspective: 1000px;
        transform-style: preserve-3d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #drag-container,
      #spin-container {
        pointer-events: none; /* only the covers and the coin take clicks */
        position: relative;
        display: flex;
        margin: auto;
        transform-style: preserve-3d;
        transform: rotateX(-10deg);
      }

      #drag-container img {
        transform-style: preserve-3d;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 0 8px #fff;
        -webkit-box-reflect: below 10px
          linear-gradient(transparent, transparent, #0005);
        -webkit-user-drag: none;
        user-select: none;
      }

      #drag-container img:hover,
      #drag-container img.active {
        box-shadow: 0 0 15px #fffd;
        -webkit-box-reflect: below 10px
          linear-gradient(transparent, transparent, #0007);
      }

      /* coin lying on the ground, with the logo on top; opens the "me" menu */
      #coin {
        position: absolute;
        top: 100%;
        left: 50%;
        width: 85.5px;
        height: 85.5px;
        transform: translate(-50%, -50%) rotateX(90deg);
        transform-style: preserve-3d;
        cursor: pointer;
        pointer-events: none;
      }
      #coin.ready {
        pointer-events: auto;
      }
      #coin div {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        /* fades in once the covers have formed the circle; the faces fade
           one by one because opacity on #coin itself would flatten its 3D */
        opacity: 0;
        transition: opacity 2s;
      }
      #coin.ready div {
        opacity: 1;
      }
      #coin .side {
        background: #9c7a14;
      }
      #coin .top {
        background: url("../img/favicon.png") center / 58% no-repeat,
          radial-gradient(circle at 35% 30%, #fff1b0, #f2c230 55%, #b98a12);
        box-shadow: inset 0 0 0 4px #d9a520, inset 0 0 0 5px #ffe58ab0,
          inset 0 0 9px #0004;
      }
      #coin:hover .top,
      #coin.active .top {
        background: url("../img/favicon.png") center / 58% no-repeat,
          radial-gradient(circle at 35% 30%, #fff6c8, #ffd84a 55%, #cc9a1a);
      }
      #coin .glow {
        inset: -9px;
        background: radial-gradient(circle, #ffd04a44, transparent 70%);
        pointer-events: none;
      }

      #ground {
        pointer-events: none; /* the coin sits on it and must get the clicks */
        width: 900px;
        height: 900px;
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(90deg);
        background: radial-gradient(
          farthest-side at center center,
          #9993,
          transparent
        );
      }

      @keyframes spin {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }
      @keyframes spinRevert {
        from {
          transform: rotateY(360deg);
        }
        to {
          transform: rotateY(0deg);
        }
      }

      /* hint under the carousel */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 5%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 22px;
        padding: 0 16px;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        color: #fff6;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #hint span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      #hint svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #hint .dot {
        fill: currentColor;
        stroke: none;
      }
      body.menu-open #hint {
        opacity: 0;
      }

      /* back to the home page */
      #back {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        color: #f2f2f6;
        background: #1c1c22b3;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid #ffffff1f;
        transition: background 0.12s, transform 0.12s;
      }
      #back:hover,
      #back:focus-visible {
        background: #ffffff24;
        outline: none;
        transform: translateX(-2px);
      }
      #back svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- listen-on dropdown ---------- */
      #backdrop {
        position: fixed;
        inset: 0;
        background: #0007;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 9;
      }

      #menu {
        --accent: #e8e8ee;
        position: fixed;
        z-index: 10;
        width: 270px;
        padding: 8px;
        border-radius: 16px;
        background: #1c1c22e6;
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid #ffffff1f;
        box-shadow: 0 18px 50px #000a, 0 0 0 1px #0006;
        color: #f2f2f6;
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
        transform-origin: top center;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.16s, transform 0.16s, visibility 0.16s;
      }
      #menu.open,
      #backdrop.open {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }
      #menu.open {
        transform: none;
      }

      #menu header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 8px 10px;
        margin-bottom: 4px;
        border-bottom: 1px solid #ffffff14;
      }
      #menu header img {
        width: 46px;
        height: 46px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 2px 10px #0008;
      }
      #menu header img.logo {
        object-fit: contain;
        padding: 7px;
        background: #e9e9ee;
        border-radius: 50%;
      }
      #menu header strong {
        display: block;
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.25;
      }
      #menu header span {
        display: block;
        margin-top: 2px;
        font-size: 0.78rem;
        color: #ffffff8c;
      }

      #menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 10px;
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        font-size: 0.95rem;
        transition: background 0.12s;
      }
      #menu a:hover,
      #menu a:focus-visible {
        background: #ffffff17;
        outline: none;
      }
      #menu a:active {
        background: #ffffff24;
      }
      #menu a svg {
        flex: none;
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      #menu a .arrow {
        margin-left: auto;
        width: 16px;
        height: 16px;
        opacity: 0.4;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #menu a:hover .arrow {
        opacity: 0.9;
      }
      #menu a[data-p="youtube"] svg:first-child {
        color: #ff4e45;
      }
      #menu a[data-p="spotify"] svg:first-child {
        color: #1ed760;
      }
      #menu a[data-p="apple"] svg:first-child {
        color: #fa586a;
      }
      #menu a[data-p="amazon"] svg:first-child {
        color: #25d1da;
      }
      #menu a[data-p="instagram"] svg:first-child {
        color: #f0507f;
      }

      /* phones: bottom sheet */
      @media (max-width: 600px) {
        #menu {
          left: 12px !important;
          right: 12px;
          top: auto !important;
          bottom: 12px;
          width: auto;
          padding: 10px;
          border-radius: 20px;
          transform: translateY(24px);
          transform-origin: bottom center;
        }
        #menu.open {
          transform: none;
        }
        #menu a {
          padding: 14px 12px;
          font-size: 1.02rem;
        }
        #menu header img {
          width: 54px;
          height: 54px;
        }
      }
    </style>
  </head>

    <script>
      // Carousel based on 3DCarousel by Hoang Tran:
      // https://github.com/HoangTran0410/3DCarousel/blob/master/index.html

      // ---------------------------------------------------------------
      // Tracks, in carousel order. Each link goes to that track/release.
      // To change a link, edit it here.
      // ---------------------------------------------------------------
      var AMAZON_SEARCH = "https://music.amazon.com/search/";
      var TRACKS = [
        {
          title: "Warm Hug in the Haze",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/e5/f8/08/e5f808ed-bf8d-4f06-98f6-47a139040e36/859785697697_cover.jpg/600x600bb.jpg",

          spotify: "https://open.spotify.com/track/5kvtNFz3odqKUaoPpDVooM",
          apple: "https://music.apple.com/ca/album/warm-hug-in-the-haze-single/1736810389",
        },
        {
          title: "Quill in Dreams",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/fc/dd/d0/fcddd07a-99bd-98ae-6c4a-cd65b385e32c/859786134917_cover.jpg/600x600bb.jpg",
          youtube: "https://www.youtube.com/watch?v=l4QD-_PkcAA",

          apple: "https://music.apple.com/ca/album/quill-in-dreams-single/1738897739",
        },
        {

          youtube: "https://www.youtube.com/watch?v=lJxaDjXgxEA",
          spotify: "https://open.spotify.com/track/0eoJzCkIjHNFUpqIGyhs1F",
          apple: "https://music.apple.com/ca/album/the-winding-life-of-mine-single/1739741551",
        },
        {

        },
        {
          title: "Sand Painting",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/dc/2c/8c/dc2c8cd3-ef9d-dcfd-9957-21934793eb6d/859791168723_cover.jpg/600x600bb.jpg",
          youtube: "https://www.youtube.com/watch?v=iyS0UR1aybE",
          spotify: "https://open.spotify.com/track/5QcVGOqcTVTZprT4cahPGF",
          apple: "https://music.apple.com/ca/album/sand-painting-single/1758066770",
        },
        {
          title: "The Castle",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/01/97/3b/01973be5-cc7e-a574-50b1-35704c586ade/859797759581_cover.jpg/600x600bb.jpg",

          visualizer: "https://www.youtube.com/watch?v=iR3dUG6WAdo",
          spotify: "https://open.spotify.com/track/0yyWqKIIqkazUdvi0BDT4M",
          apple: "https://music.apple.com/ca/album/the-castle-single/1782719531",
        },
        {
          title: "Hide and Seek",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/aa/b6/80/aab680a9-5a9b-392d-f841-7f2a9a601ac7/859706216105_cover.jpg/600x600bb.jpg",

          spotify: "https://open.spotify.com/track/6kWnHCheJ0iZN9xAN4hxc7",
          apple: "https://music.apple.com/ca/album/hide-and-seek-single/1814089428",
        },
        {
          title: "Mirage",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/d1/1e/b2/d11eb24c-8b84-429b-6bb2-0aa3a9eff78b/859719380121_cover.jpg/600x600bb.jpg",
          youtube: "https://www.youtube.com/watch?v=107WHniP20Q",
          spotify: "https://open.spotify.com/track/07nac6ffuyiNXRqrUC6zlG",
          apple: "https://music.apple.com/ca/album/mirage-single/1844149438",
        },
        {
          title: "Yalda",
          cover: "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/42/d6/3a/42d63a2e-4a76-ff70-a3c2-0ce7b45bf894/859724566763_cover.jpg/600x600bb.jpg",
          youtube: "https://www.youtube.com/watch?v=yCy9zCm7sCo",
          spotify: "https://open.spotify.com/track/5IBe3tSR9ETYd6UDoqlIJy",
          apple: "https://music.apple.com/ca/album/yalda-single/1858016767",
        },
      ];
      // Amazon Music always opens a search for the track (generated here, so
      // tracks need no amazon field).
      TRACKS.forEach(function (t) {
        t.amazon = AMAZON_SEARCH + encodeURIComponent(t.title + " Behzad Shayegh");
      });

      var PLATFORMS = [
        { key: "youtube", name: "YouTube", icon: "i-youtube" },
        { key: "spotify", name: "Spotify", icon: "i-spotify" },
        { key: "apple", name: "Apple Music", icon: "i-apple" },
        { key: "amazon", name: "Amazon Music", icon: "i-amazon" },
      ];

      // You can change global variables here:
      var narrow = Math.min(window.innerWidth, window.innerHeight) < 600;
      var radius = narrow ? Math.min(150, window.innerWidth * 0.36) : 180; // how big of the radius
      var autoRotate = true; // auto rotate or not
      var rotateSpeed = -60; // unit: seconds/360 degrees
      var imgWidth = narrow ? 100 : 120; // width of images (unit: px)
      var imgHeight = imgWidth; // height of images (unit: px)

      var odrag = document.getElementById("drag-container");
      var ospin = document.getElementById("spin-container");

      // Build the covers
      var ground0 = ospin.querySelector("p");
      TRACKS.forEach(function (t, i) {
        var img = document.createElement("img");
        img.src = t.cover;
        img.alt = t.title + " (cover)";
        img.draggable = false;
        img.dataset.index = i;
        ospin.insertBefore(img, ground0);
      });
      var aEle = Array.prototype.slice.call(ospin.getElementsByTagName("img"));

      // The coin: a stack of discs gives it thickness (top face last, with the logo)
      var coin = document.getElementById("coin");
      var COIN_THICKNESS = 5;
      var glow = document.createElement("div");
      glow.className = "glow";
      glow.style.transform = "translateZ(-" + (COIN_THICKNESS + 1) + "px)";
      coin.appendChild(glow);
      for (var z = COIN_THICKNESS; z > 0; z--) {
        var side = document.createElement("div");
        side.className = "side";
        side.style.transform = "translateZ(-" + z + "px)";
        coin.appendChild(side);
      }
      var coinTop = document.createElement("div");
      coinTop.className = "top";
      coin.appendChild(coinTop);

      // Size of images
      ospin.style.width = imgWidth + "px";
      ospin.style.height = imgHeight + "px";

      // Size of ground - depend on radius
      var ground = document.getElementById("ground");
      ground.style.width = radius * 1.5 + "px";
      ground.style.height = radius * 1.5 + "px";

      // ===================== carousel =======================
      setTimeout(init, 100);

      function init(delayTime) {
        for (var i = 0; i < aEle.length; i++) {
          aEle[i].style.transform =
            "rotateY(" +
            i * (360 / aEle.length) +
            "deg) translateZ(" +
            radius +
            "px)";
          aEle[i].style.transition = "transform 1s";
          aEle[i].style.transitionDelay =
            delayTime || (aEle.length - i) / 4 + "s";
        }
        // the last cover starts after aEle.length / 4 s and moves for 1 s
        setTimeout(function () {
          coin.classList.add("ready");
        }, (aEle.length / 4 + 1) * 1000);
      }

      function applyTranform(obj) {
        // Constrain the angle of camera (between 0 and 180)
        if (tY > 90) tY = 90;
        if (tY < 0) tY = 0;

        // Apply the angle
        obj.style.transform = "rotateX(" + -tY + "deg) rotateY(" + tX + "deg)";
      }

      var spinPaused = false; // true while the dropdown is open
      function playSpin(yes) {
        ospin.style.animationPlayState =
          yes && !spinPaused ? "running" : "paused";
      }

      var desX = 0,
        desY = 0,
        tX = 0,
        tY = 38; // default camera tilt: high enough to see the coin on the ground

      applyTranform(odrag);

      // auto spin
      if (autoRotate) {
        var animationName = rotateSpeed > 0 ? "spin" : "spinRevert";
        ospin.style.animation = `${animationName} ${Math.abs(
          rotateSpeed
        )}s infinite linear`;
      }

      // ===================== dropdown =======================
      var menu = document.getElementById("menu");
      var backdrop = document.getElementById("backdrop");
      var menuLinks = document.getElementById("menu-links");
      var activeImg = null;

      var ARROW_OUT = "M7 17 17 7M8 7h9v9";
      var ARROW_IN = "M5 12h14M13 6l6 6-6 6";

      // items: [{key, name, icon, href, label, internal}]
      function setItems(items) {
        menuLinks.innerHTML = "";
        items.forEach(function (it) {
          var a = document.createElement("a");
          a.dataset.p = it.key;
          a.href = it.href;
          if (!it.internal) {
            a.target = "_blank";
            a.rel = "noopener";
          }
          a.setAttribute("role", "menuitem");
          a.setAttribute("aria-label", it.label);
          a.innerHTML =
            '<svg aria-hidden="true"><use href="#' + it.icon + '"/></svg>' +
            "<span>" + it.name + "</span>" +
            '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="' +
            (it.internal ? ARROW_IN : ARROW_OUT) + '"/></svg>';
          menuLinks.appendChild(a);
        });
      }

      function trackItems(t) {
        var items = [];
        PLATFORMS.forEach(function (p) {
          items.push({ key: p.key, name: p.name, icon: p.icon, href: t[p.key],
            label: t.title + " on " + p.name });
          // tracks with a visualizer video get a second YouTube entry
          if (p.key === "youtube" && t.visualizer)
            items.push({ key: "youtube", name: "YouTube (Visualizer)", icon: p.icon,
              href: t.visualizer, label: t.title + " visualizer on YouTube" });
        });
        return items;
      }

      var ME_ITEMS = [
        { key: "home", name: "Home page", icon: "i-home", href: "../home/",
          label: "Home page", internal: true },
        { key: "instagram", name: "Instagram", icon: "i-instagram",
          href: "https://www.instagram.com/the.shayegh/", label: "Instagram" },
        // my artist pages (not a single track)
        { key: "youtube", name: "YouTube", icon: "i-youtube",
          href: "https://www.youtube.com/@TheShayegh", label: "Artist page on YouTube" },
        { key: "spotify", name: "Spotify", icon: "i-spotify",
          href: "https://open.spotify.com/artist/64d5j2QxK4Ae8jZ36RK7Yt",
          label: "Artist page on Spotify" },
        { key: "apple", name: "Apple Music", icon: "i-apple",
          href: "https://music.apple.com/ca/artist/behzad-shayegh/1736428336",
          label: "Artist page on Apple Music" },
        { key: "amazon", name: "Amazon Music", icon: "i-amazon",
          href: "https://www.amazon.com/music/player/artists/B0CYJCP41W/behzad-shayegh",
          label: "Artist page on Amazon Music" },
      ];

      // el: the tapped cover (<img>) or the coin; x, y: where it was tapped
      function openMenu(el, x, y) {
        var logo = document.getElementById("menu-cover");
        if (el.id === "coin") {
          logo.src = "../img/favicon.png";
          logo.className = "logo";
          document.getElementById("menu-title").textContent = "Behzad Shayegh";
          document.getElementById("menu-sub").textContent = "More from me";
          setItems(ME_ITEMS);
        } else {
          var t = TRACKS[el.dataset.index];
          logo.src = t.cover;
          logo.className = "";
          document.getElementById("menu-title").textContent = t.title;
          document.getElementById("menu-sub").textContent = "Behzad Shayegh";
          setItems(trackItems(t));
        }

        if (activeImg) activeImg.classList.remove("active");
        activeImg = el;
        el.classList.add("active");

        // desktop: dropdown near the click; phones: bottom sheet (CSS)
        if (window.innerWidth > 600) {
          var w = menu.offsetWidth || 270;
          var h = menu.offsetHeight || 260;
          var left = Math.max(12, Math.min(x - w / 2, window.innerWidth - w - 12));
          var top = y + 14;
          if (top + h > window.innerHeight - 12) top = Math.max(12, y - h - 14);
          menu.style.left = left + "px";
          menu.style.top = top + "px";
        }

        spinPaused = true;
        playSpin(false);
        document.body.classList.add("menu-open");
        menu.classList.add("open");
        backdrop.classList.toggle("open", window.innerWidth <= 600);
        menu.setAttribute("aria-hidden", "false");
      }

      function closeMenu() {
        if (!menu.classList.contains("open")) return;
        menu.classList.remove("open");
        backdrop.classList.remove("open");
        menu.setAttribute("aria-hidden", "true");
        document.body.classList.remove("menu-open");
        if (activeImg) activeImg.classList.remove("active");
        activeImg = null;
        spinPaused = false;
        playSpin(true);
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeMenu();
      });

      // ===================== pointer events =======================
      // A press that moves less than a few px is a tap/click on a cover;
      // anything more is a drag that rotates the carousel.
      document.onpointerdown = function (e) {
        if (menu.contains(e.target) || e.target.closest("#back")) return; // let the links work
        clearInterval(odrag.timer);
        var sX = e.clientX,
          sY = e.clientY;
        var startX = sX,
          startY = sY;
        var moved = false;
        var tapped = e.target.closest ? e.target.closest("#spin-container img, #coin") : null;
        if (!tapped) closeMenu();

        this.onpointermove = function (e) {
          var nX = e.clientX,
            nY = e.clientY;
          if (Math.abs(nX - startX) + Math.abs(nY - startY) > 8) {
            if (!moved) closeMenu();
            moved = true;
          }
          desX = nX - sX;
          desY = nY - sY;
          tX += desX * 0.1;
          tY += desY * 0.1;
          applyTranform(odrag);
          sX = nX;
          sY = nY;
        };

        this.onpointerup = function (e) {
          this.onpointermove = this.onpointerup = null;
          if (!moved && tapped) {
            desX = desY = 0;
            if (tapped === activeImg) closeMenu();
            else openMenu(tapped, e.clientX, e.clientY);
            return;
          }
          odrag.timer = setInterval(function () {
            desX *= 0.95;
            desY *= 0.95;
            tX += desX * 0.1;
            tY += desY * 0.1;
            applyTranform(odrag);
            playSpin(false);
            if (Math.abs(desX) < 0.5 && Math.abs(desY) < 0.5) {
              clearInterval(odrag.timer);
              playSpin(true);
            }
          }, 17);
        };

        return false;
      };
    </script>
  </body>
</html>
